research:
  selected: true
  request:
    questions:
      - What is the lowest-complexity viable contact-form approach for a static vanilla HTML/CSS/JS portfolio while keeping the owner's email private, supporting accessible success/error states, preventing spam, and validating anti-bot tokens server-side?
      - What evidence and sanitization gates are required before publishing project screenshots or repositories that may contain credentials, personal data, document numbers, locations, or security-operation details?
      - What truthfulness and privacy constraints should govern an AI-assisted realistic professional portrait based on the owner's real photographs?
    source_classes:
      - documentation
