  product_decisions:
    status: confirmed
    confirmed:
      - Cloudflare Pages free tier for hosting and deployment.
      - Formspree Free for contact submission delivery to a private linked email; do not display the personal email address publicly.
      - Cloudflare Turnstile with the selected Formspree contact flow for spam protection.
      - Initial Formspree Free constraints accepted: 50 submissions per month and 30 days of submission history.
      - V1 portrait uses an authentic real photograph with site-native visual treatment at zero cost; do not use AI to generate or materially alter identity.
      - The owner must manually approve the final V1 photograph before publication; AI-assisted portrait generation is deferred to a possible later version.
      - The photograph supplied in the active conversation is approved as a V1 source image for composition, cropping, color treatment, and visual integration without identity alteration; this is not final publication approval, and no filesystem asset path exists yet.
      - V1 will include written case studies and owner-approved sanitized screenshots for RondApp and AccessCampus360; their repositories remain private, and repository publication is deferred.
      - Every V1 screenshot must pass the established manual sanitization/publication gate for secrets, PII, document numbers, locations, and security-operation details before use.
