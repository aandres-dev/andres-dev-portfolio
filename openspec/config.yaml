# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Vanilla HTML5, CSS @layer + oklch tokens, Vanilla JS (browser IIFE; Node ESM tests)
  Architecture: Root index.html with src/styles/* and src/scripts/* modules; no framework; no npm dependencies
  Testing: Workspace `npm test` runs markup + stress audits; node:test form suite is unwired and targets missing src/js/form.js
  Style: Gentle AI conventions, semantic HTML5, Typespiration typography, Obsidian/Crimson/Gold OKLCH palette

strict_tdd: true

projects:
  - path: .
    stack: Vanilla HTML/CSS/JS
    test_command: npm test
    framework: custom-node-runner

testing:
  strict_tdd: true
  detected: "2026-09-03"
  workspace_test_command: npm test
  projects:
    - path: .
      stack: Vanilla HTML/CSS/JS
      test_command: npm test
      framework: custom-node-runner
      extra_test_commands:
        - node test/form.test.js
      layers:
        unit:
          available: false
          tool: "node:test file test/form.test.js exists but is not in npm test and imports missing src/js/form.js"
        integration:
          available: false
          tool: ""
        e2e:
          available: false
          tool: ""
      coverage:
        available: false
        command: ""
      quality:
        linter:
          available: false
          command: ""
        type_checker:
          available: false
          command: ""
        formatter:
          available: false
          command: ""
        custom_static_audits:
          available: true
          command: npm test
        custom_validator:
          available: true
          command: node script/validate.js

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Zero divitis, strict semantic HTML5
      - Compositor-only 60fps animations
    tdd: true
    test_command: npm test
  verify:
    test_command: npm test
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
