<form id="contact-form" method="post">
  <noscript>
    <p>This form needs JavaScript to send the message.</p>
  </noscript>
  <p id="contact-status" role="status" aria-live="polite" tabindex="-1"></p>
  <button type="button" id="contact-retry" hidden>Retry</button>
  <label id="contact-turnstile-label" for="contact-turnstile">Verification</label>
  <span id="contact-turnstile"></span>
</form>
