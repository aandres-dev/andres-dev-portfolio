<section id="contact" aria-labelledby="contact-heading">
  <h2 id="contact-heading" data-i18n="form.heading">Contacto laboral</h2>
  <p data-i18n="form.lede">Para oportunidades laborales, envía un mensaje con este formulario.</p>
  <form id="contact-form" class="contact-form" method="post" action="https://formspree.io/f/FORMSPREE_FORM_ID_PLACEHOLDER" aria-describedby="contact-privacy contact-status">
    <div class="field">
      <label for="contact-name" data-i18n="form.name">Nombre</label>
      <input id="contact-name" name="name" type="text" required autocomplete="name" aria-describedby="contact-name-error">
      <p id="contact-name-error" class="field-error" data-i18n="form.nameError" hidden>Escribe tu nombre.</p>
    </div>
    <div class="field">
      <label for="contact-email" data-i18n="form.email">Correo</label>
      <input id="contact-email" name="email" type="email" required autocomplete="email" aria-describedby="contact-email-error">
      <p id="contact-email-error" class="field-error" data-i18n="form.emailError" hidden>Escribe un correo válido.</p>
    </div>
    <div class="field">
      <label for="contact-message" data-i18n="form.message">Mensaje</label>
      <textarea id="contact-message" name="message" required aria-describedby="contact-message-error"></textarea>
      <p id="contact-message-error" class="field-error" data-i18n="form.messageError" hidden>Escribe un mensaje.</p>
    </div>
    <div class="field">
      <p id="contact-turnstile-label" class="turnstile-label" data-i18n="form.turnstileLabel">Verificación</p>
      <div id="contact-turnstile" class="turnstile-slot"></div>
    </div>
    <p id="contact-privacy" class="form-privacy" data-i18n="form.privacy">Los mensajes los procesa Formspree y se conservan 30 días en la cuenta de Formspree.</p>
    <div class="form-actions">
      <button type="submit" class="cta" data-i18n="form.submit">Enviar</button>
      <button type="button" id="contact-retry" class="form-retry" data-i18n="form.retry" hidden>Reintentar</button>
    </div>
    <p id="contact-status" class="form-status" role="status" aria-live="polite" tabindex="-1"></p>
  </form>
</section>
