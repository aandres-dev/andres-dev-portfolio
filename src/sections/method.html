<section id="method">
  <h2 data-i18n="method.heading">Método</h2>
  <p data-i18n="method.lede">La IA no trabaja sola. Yo defino el objetivo, reviso el resultado y lo compruebo.</p>
  <ol class="method-list">
    <li data-i18n="method.direct">Dirijo el alcance y las decisiones.</li>
    <li data-i18n="method.question">Cuestiono supuestos, contradicciones y atajos.</li>
    <li data-i18n="method.verify">Verifico contra pruebas, evidencia y límites reales.</li>
  </ol>
</section>
