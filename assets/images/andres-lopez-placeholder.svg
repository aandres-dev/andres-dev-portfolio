<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="50%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#14141d" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" fill="url(#bgGrad)" />
  
  <!-- Subtle Architectural Grid Pattern -->
  <g stroke="#232330" stroke-width="0.5" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="360" x2="400" y2="360" />
    <line x1="0" y1="420" x2="400" y2="420" />
  </g>

  <!-- Rim Light Edge -->
  <rect x="1" y="1" width="398" height="478" fill="none" stroke="url(#rimLight)" stroke-width="2" rx="4" />

  <!-- Stylized Architectural Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="180" r="64" fill="#181824" stroke="#2a2a3c" stroke-width="1.5" />
  
  <!-- Torso / Shoulders -->
  <path d="M 100 390 C 105 285, 140 265, 200 265 C 260 265, 295 285, 300 390 Z" fill="#12121c" stroke="#252538" stroke-width="1.5" />

  <!-- Futuristic Architectural HUD Monogram -->
  <g transform="translate(200, 180)">
    <circle r="48" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
    <circle r="56" fill="none" stroke="#e63946" stroke-width="0.75" opacity="0.4" />
    <text text-anchor="middle" y="7" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="url(#goldGlow)" letter-spacing="0.1em">AL</text>
  </g>

  <!-- Tag / Directive Label -->
  <g transform="translate(200, 430)">
    <rect x="-95" y="-18" width="190" height="34" rx="2" fill="#0d0d14" stroke="#333348" stroke-width="1" />
    <text text-anchor="middle" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#e0e0ea" letter-spacing="0.08em">&lt;andres.{dev}&gt;</text>
  </g>
</svg>
