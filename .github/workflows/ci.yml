name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  audits:
    name: Static audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CSP hashes, markup semantics, payload budgets and form behaviour.
      # No dependencies needed: these run on the Node standard library.
      - run: node script/validate-comments.js
      - run: node script/validate-commit-attribution.js
      - run: node script/csp.js --check
      - run: node script/build-i18n.js --check
      - run: node test/markup.test.js
      - run: node test/stress-audit.js
      - run: node test/form.test.js

  e2e:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No system Chromium on the runner, so Playwright supplies its own.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
